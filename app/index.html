<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="color-scheme" content="light dark">
	<title>Comets</title>
	<link rel="icon" href="data:,">
	<script>
		// the stored theme before the first paint, read as services/settings.js stores it;
		// ui/shell/theme.js follows the setting from then on
		try {
			const { theme } = JSON.parse(localStorage.getItem('comets.settings') ?? '{}');
			if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
		} catch {
			// no storage, or no settings in it: the OS decides until the settings have loaded
		}
	</script>
	<link rel="stylesheet" href="css/tokens.css">
	<link rel="stylesheet" href="css/shell.css">
	<link rel="stylesheet" href="css/components.css">
	<link rel="stylesheet" href="css/database.css">
	<link rel="stylesheet" href="css/ephemeris.css">
	<link rel="stylesheet" href="css/graph.css">
	<link rel="stylesheet" href="css/help.css">
	<link rel="stylesheet" href="css/settings.css">
	<link rel="stylesheet" href="css/update.css">
	<script type="module" src="js/main.js"></script>
</head>
<body>
	<header class="shell-header">
		<a class="shell-brand" href="#/database">Comets</a>
		<nav id="nav" class="shell-nav" aria-label="Views"></nav>
	</header>
	<main id="view" class="shell-view"></main>
	<footer id="status" class="shell-status"></footer>
	<div id="notices" class="shell-notices" popover="manual" aria-live="polite"></div>
	<noscript>Comets needs JavaScript.</noscript>
</body>
</html>
